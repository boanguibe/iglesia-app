<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NazarApp — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#8B2635">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Iglesia App">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>

<body>

  <!-- HEADER -->
  <header>
    <div class="header-contenido">
      <div class="header-icono">✝️</div>
      <div class="header-texto">
        <h1>NazarApp</h1>
        <p>Iglesia del Nazareno "Los Lobos" — Talcahuano</p>
      </div>
      <div class="header-usuario">
        <span id="rol-badge" class="rol-badge" style="display:none;"></span>
        <span id="nombre-usuario"></span>
        <button class="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <!-- NAVEGACIÓN -->
  <nav class="navegacion">
    <div class="navegacion-inner">
      <a href="/" id="nav-registros" class="nav-link">📋 Registros</a>
      <a href="/dashboard.html" id="nav-dashboard" class="nav-link activo">📊 Asistencia</a>
      <a href="/miembros.html" id="nav-miembros" class="nav-link">👥 Miembros</a>
      <a href="/estadisticas.html" id="nav-estadisticas" class="nav-link">📈 Estadísticas</a>
      <a href="/usuarios.html" id="nav-usuarios" class="nav-link">⚙️ Usuarios</a>
    </div>
  </nav>

  <main>

    <!-- TARJETAS DE RESUMEN -->
    <section class="resumen">
      <div class="tarjeta-resumen">
        <span class="resumen-icono">📅</span>
        <span class="resumen-numero" id="total-cultos">0</span>
        <span class="resumen-label">Cultos registrados</span>
      </div>
      <div class="tarjeta-resumen">
        <span class="resumen-icono">👥</span>
        <span class="resumen-numero" id="total-personas">0</span>
        <span class="resumen-label">Total asistentes</span>
      </div>
      <div class="tarjeta-resumen">
        <span class="resumen-icono">📊</span>
        <span class="resumen-numero" id="promedio-asistencia">0</span>
        <span class="resumen-label">Promedio por culto</span>
      </div>
      <div class="tarjeta-resumen">
        <span class="resumen-icono">🏆</span>
        <span class="resumen-numero" id="mejor-culto">0</span>
        <span class="resumen-label">Mayor asistencia</span>
      </div>
    </section>

    <!-- GRÁFICOS -->
    <div class="graficos-grid">

      <!-- Gráfico de línea: asistencia en el tiempo -->
      <div class="tarjeta grafico-card grafico-grande">
        <div class="tarjeta-header">
          <h2>📈 Asistencia por Culto</h2>
        </div>
        <div class="grafico-contenedor">
          <canvas id="grafico-asistencia"></canvas>
        </div>
      </div>

      <!-- Gráfico de torta: distribución -->
      <div class="tarjeta grafico-card">
        <div class="tarjeta-header">
          <h2>🥧 Distribución</h2>
        </div>
        <div class="grafico-contenedor">
          <canvas id="grafico-distribucion"></canvas>
        </div>
      </div>

      <!-- Gráfico de barras: por predicador -->
      <div class="tarjeta grafico-card grafico-grande">
        <div class="tarjeta-header">
          <h2>🏆 Asistencia Promedio por Predicador</h2>
        </div>
        <div class="grafico-contenedor">
          <canvas id="grafico-predicadores"></canvas>
        </div>
      </div>

    </div>

  </main>

  <script src="auth.js"></script>
  <script src="dashboard.js"></script>

  <!-- Registrar Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .then(() => console.log("✅ Service Worker registrado"))
          .catch(err => console.log("❌ Error SW:", err))
      })
    }
  </script>

</body>

</html>
