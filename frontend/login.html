<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Iniciar Sesión — Iglesia del Nazareno</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Iglesia App">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
  </head>
  <body class="body-login">

    <div class="login-container">

      <div class="login-header">
        <div class="login-icono">✝️</div>
        <h1>Iglesia del Nazareno</h1>
        <p>Los Lobos — Talcahuano</p>
      </div>

      <div class="tarjeta login-card">

        <div class="tarjeta-header">
          <h2>Iniciar Sesión</h2>
        </div>

        <div style="padding: 24px;">

          <div class="campo">
            <label>Email</label>
            <input type="email" id="email" placeholder="tu@email.com">
          </div>

          <div class="campo" style="margin-top: 16px;">
            <label>Contraseña</label>
            <input type="password" id="password" placeholder="••••••••">
          </div>

          <p class="mensaje-error" id="error" style="display:none; margin-top: 12px;">
            ⚠️ Email o contraseña incorrectos.
          </p>

          <button
            class="btn-guardar"
            id="btn-login"
            onclick="iniciarSesion()"
            style="width: 100%; margin-top: 24px;">
            Entrar
          </button>

        </div>

      </div>

    </div>

    <script src="auth.js"></script>

    <!-- Registrar Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then(() => console.log("✅ Service Worker registrado"))
            .catch(err => console.log("❌ Error SW:", err))
        })
      }
    </script>

  </body>
</html>
